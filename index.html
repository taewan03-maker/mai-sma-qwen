<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAI SMA · Qwen Maintenance Advisor</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script><script defer src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script></head><body>
<aside class="sidebar" id="sidebar"><div class="model"><button class="icon" id="closeSidebar" aria-label="메뉴 닫기">☰</button><span class="spark" aria-hidden="true">✦</span><div><strong>Qwen3-1.7B</strong><small>WebGPU · BROWSER MODEL</small></div></div><button class="new-chat" id="newChat"><span>＋</span> New chat <kbd>새 대화</kbd></button><div class="nav-label">정비 기록에 질문하기</div><nav id="suggestions" aria-label="추천 질문"></nav><div class="history-head"><span>Recent chats</span><span id="historyCount">0</span></div><nav id="history" aria-label="대화 기록"></nav><div class="sidebar-footer"><div><span class="online-dot" id="connectionDot"></span><span id="connectionText">모델 상태 확인 중</span><small id="indexCount">데이터를 불러오는 중…</small></div><button class="icon" id="settings" aria-label="설정 및 데이터 정보">⚙</button></div></aside>
<div id="shade" class="shade"></div><main><header><div class="header-brand"><button class="icon" id="menu" aria-label="메뉴 열기">☰</button><div><h1>MAI SMA</h1><p>Smart Maintenance Advisor</p></div></div><div class="toggles"><button class="toggle-pill" id="bilingual" role="switch" aria-checked="true"><span class="switch on"></span>원문 함께 보기</button><button class="toggle-pill" id="theme" role="switch" aria-checked="false">Light <span class="switch"></span> Dark</button></div></header><div class="model-toolbar"><button id="loadModel" type="button">Qwen 모델 불러오기</button><div><span id="modelProgress">처음 접속하면 모델 약 1GB를 다운로드합니다. WebGPU 지원 PC 브라우저가 필요합니다.</span><progress id="modelProgressBar" max="1" value="0" hidden></progress></div></div><div class="conversation" id="conversation" aria-live="polite"></div><div class="composer-wrap"><div class="status-row" id="statusRow" hidden><span class="spinner"></span><span id="stageName"></span><span id="elapsed">0.0s</span></div><form id="composer"><textarea id="question" rows="1" maxlength="2000" aria-label="정비 질문" placeholder="선박 정비 기록에 대해 질문하세요"></textarea><button id="send" type="submit" aria-label="질문 보내기"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m4 4 17 8-17 8 3-8-3-8Z"/><path d="M7 12h14"/></svg></button><button id="stop" type="button" hidden aria-label="표시 요청 중단">■</button></form><p class="composer-note">모델은 이 브라우저에서 실행됩니다. 실제 조치는 제조사 매뉴얼·선내 절차와 담당 기관사의 판단을 따르세요.</p></div></main>
<dialog id="sourceDialog"><form method="dialog" class="dialog-head"><h2>근거 원문</h2><button class="icon" aria-label="닫기">✕</button></form><div class="dialog-body" id="sourceBody"></div></dialog>
<dialog id="settingsDialog"><form method="dialog" class="dialog-head"><h2>로컬 모델 · 데이터</h2><button class="icon" aria-label="닫기">✕</button></form><div class="dialog-body" id="settingsBody"></div></dialog><div class="toast" id="toast" hidden role="status"></div></body></html>
